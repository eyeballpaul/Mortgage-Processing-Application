name: Deploy prototype changes

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: mortgage-prototype-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run this workflow from main." >&2
          exit 1
      - name: Checkout main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Reconcile prototype
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          AZURE_SQL_SERVER: ${{ vars.AZURE_SQL_SERVER }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_ALERT_EMAIL: ${{ vars.AZURE_ALERT_EMAIL }}
          OTLP_ENDPOINT: ${{ vars.OTLP_ENDPOINT }}
          OTLP_PROTOCOL: ${{ vars.OTLP_PROTOCOL }}
          MORTGAGE_API_CLIENT_ID: ${{ vars.MORTGAGE_API_CLIENT_ID }}
          STAFF_CLIENT_ID: ${{ vars.STAFF_CLIENT_ID }}
          STAFF_CLIENT_SECRET: ${{ secrets.STAFF_CLIENT_SECRET }}
          PRODUCTS_API_KEY: ${{ secrets.PRODUCTS_API_KEY }}
          ELIGIBILITY_API_KEY: ${{ secrets.ELIGIBILITY_API_KEY }}
          DEPLOYMENT_FINGERPRINT_KEY: ${{ secrets.DEPLOYMENT_FINGERPRINT_KEY }}
        run: bash infra/deployment/reconcile-prototype.sh
