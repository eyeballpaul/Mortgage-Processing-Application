name: Build, test and security checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore PD.Mortgages.slnx

      - name: Build
        run: dotnet build PD.Mortgages.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PD.Mortgages.slnx --configuration Release --no-build --no-restore --verbosity normal

      - name: Test deployment scripts
        run: |
          python3 -m unittest discover -s infra/tests -p 'test_affected.py'
          bash infra/tests/release-test.sh
          bash infra/tests/app-stack-test.sh
          bash infra/tests/foundation-stack-test.sh
          bash infra/tests/stack-parameters-test.sh
          bash infra/tests/reconcile-prototype-test.sh
          bash infra/tests/sync-staff-callbacks-test.sh
          bash infra/tests/quickstart-test.sh
          bash infra/tests/delete-prototype-test.sh
          bash infra/tests/remove-legacy-receiver-test.sh
          bash infra/tests/setup-notification-permissions-test.sh

      - name: Check vulnerable NuGet packages
        shell: pwsh
        run: |
          $output = dotnet list PD.Mortgages.slnx package --vulnerable --include-transitive 2>&1
          $output
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($output -match 'has the following vulnerable packages') {
            Write-Error 'Vulnerable NuGet packages were detected.'
            exit 1
          }

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  build-images:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: build-test-scan
    runs-on: ubuntu-latest
    concurrency:
      group: mortgage-prototype-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sign in to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Plan application changes
        id: plan
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          APP_PLAN: ${{ runner.temp }}/app-plan.json
        run: |
          bash infra/deployment/plan-apps.sh
          if [[ -f "$APP_PLAN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build affected images
        id: images
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          BASE_SHA: ${{ github.event.before }}
          BUILD_ALL: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          RELEASE_MANIFEST: ${{ runner.temp }}/release-manifest.json
          APP_PLAN: ${{ runner.temp }}/app-plan.json
        run: |
          bash infra/deployment/build-images.sh
          if [[ -f "$RELEASE_MANIFEST" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show deployment plan
        if: steps.plan.outputs.available == 'true'
        env:
          APP_PLAN: ${{ runner.temp }}/app-plan.json
          RELEASE_MANIFEST: ${{ runner.temp }}/release-manifest.json
        run: |
          jq -e --slurpfile manifest "$RELEASE_MANIFEST" '
            .commit == $manifest[0].commit and .registry == $manifest[0].registry and
            all(.targets[] | select(.status == "deploy" or .status == "missing"); .service as $s |
              ($manifest[0].images[$s].digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))) and
            (if .bootstrapBuild then
              $manifest[0].images["database-bootstrap"].repository == "database-bootstrap" and
              ($manifest[0].images["database-bootstrap"].digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
             else true end)
          ' "$APP_PLAN" >/dev/null
          {
            echo '## Application deployment plan'
            echo 'Review migrations, infrastructure, configuration and compatibility before applying. A changed or unverified bootstrap will run before app updates.'
            echo '| App | Decision | Reason |'
            echo '| --- | --- | --- |'
            jq -r '.targets[] | "| \(.service) | \(.status) | \(.reason) |"' "$APP_PLAN"
            echo
            jq -r '"Database: \(.bootstrapReason). Infrastructure: manual review required."' "$APP_PLAN"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save built image digests
        if: steps.images.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error

      - name: Save deployment plan
        if: steps.plan.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-plan.json
          if-no-files-found: error
