name: Build, test and security checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore PD.Mortgages.slnx

      - name: Build
        run: dotnet build PD.Mortgages.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PD.Mortgages.slnx --configuration Release --no-build --no-restore --verbosity normal

      - name: Test deployment scripts
        run: |
          python3 -m unittest discover -s infra/tests -p 'test_affected.py'
          bash infra/tests/deploy-existing-test.sh
          bash infra/tests/quickstart-test.sh
          bash infra/tests/delete-prototype-test.sh

      - name: Check vulnerable NuGet packages
        shell: pwsh
        run: |
          $output = dotnet list PD.Mortgages.slnx package --vulnerable --include-transitive 2>&1
          $output
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($output -match 'has the following vulnerable packages') {
            Write-Error 'Vulnerable NuGet packages were detected.'
            exit 1
          }

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  deploy-existing:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test-scan
    runs-on: ubuntu-latest
    concurrency:
      group: mortgage-prototype-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sign in to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check whether prototype is deployed
        id: prototype
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
        run: |
          if [[ -z "$AZURE_RESOURCE_GROUP" || -z "$AZURE_CONTAINER_REGISTRY" ]]; then
            echo "Resource group and registry variables must be configured." >&2
            exit 1
          fi
          registries="$(az resource list --resource-group "$AZURE_RESOURCE_GROUP" \
            --resource-type Microsoft.ContainerRegistry/registries --name "$AZURE_CONTAINER_REGISTRY" --output json)"
          if ! jq -e 'type == "array" and length <= 1' <<< "$registries" >/dev/null; then
            echo "Invalid registry listing; refusing to skip deployment." >&2
            exit 1
          fi
          if jq -e 'length == 1' <<< "$registries" >/dev/null; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Registry not found; skipping application deployment. Other resources may still incur charges."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy notifications and changed applications
        if: steps.prototype.outputs.deployed == 'true'
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
        run: bash infra/deployment/deploy-existing.sh
