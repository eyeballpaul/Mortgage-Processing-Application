name: Run prototype database bootstrap

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build, test and security checks run ID containing database-bootstrap
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: mortgage-prototype-deployment
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run database bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
          RELEASE_SERVICE: database-bootstrap
        run: bash infra/deployment/release-service.sh
