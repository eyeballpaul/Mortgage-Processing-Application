name: Create prototype

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mortgage-prototype-deployment
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run this workflow from main." >&2
          exit 1
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Create prototype
        env:
          AUTOMATED_DEPLOYMENT: 'true'
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          AZURE_SQL_SERVER: ${{ vars.AZURE_SQL_SERVER }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_ALERT_EMAIL: ${{ vars.AZURE_ALERT_EMAIL }}
          OTLP_ENDPOINT: ${{ vars.OTLP_ENDPOINT }}
          OTLP_PROTOCOL: ${{ vars.OTLP_PROTOCOL }}
          MORTGAGE_API_CLIENT_ID: ${{ vars.MORTGAGE_API_CLIENT_ID }}
          STAFF_CLIENT_ID: ${{ vars.STAFF_CLIENT_ID }}
          STAFF_CLIENT_SECRET: ${{ secrets.STAFF_CLIENT_SECRET }}
          PRODUCTS_API_KEY: ${{ secrets.PRODUCTS_API_KEY }}
          ELIGIBILITY_API_KEY: ${{ secrets.ELIGIBILITY_API_KEY }}
          DEPLOYMENT_FINGERPRINT_KEY: ${{ secrets.DEPLOYMENT_FINGERPRINT_KEY }}
        run: |
          if [[ ! "$DEPLOYMENT_FINGERPRINT_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Set DEPLOYMENT_FINGERPRINT_KEY to 32 random bytes encoded as hexadecimal before creating." >&2
            exit 1
          fi
          bash infra/quickstart-deploy.sh
          bash infra/deployment/initialize-stacks.sh
