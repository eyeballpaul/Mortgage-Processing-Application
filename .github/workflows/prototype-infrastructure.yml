name: Preview or apply prototype infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: Preview first; apply only after reviewing that preview
        required: true
        type: choice
        options:
          - preview
          - apply
      preview_run_id:
        description: Successful preview run ID (required for apply)
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: mortgage-prototype-deployment
  cancel-in-progress: false

jobs:
  infrastructure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Preview or apply
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          INFRA_ACTION: ${{ inputs.action }}
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
          INFRA_RESULT: ${{ runner.temp }}/infra-preview.json
        run: bash infra/deployment/infrastructure-change.sh
      - name: Save preview for apply
        if: inputs.action == 'preview'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infra-preview-${{ github.run_attempt }}
          path: ${{ runner.temp }}/infra-preview.json
          if-no-files-found: error
