trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  dotnetVersion: '10.x'
  azureServiceConnection: 'REPLACE-WITH-AZURE-DEVOPS-SERVICE-CONNECTION'
  resourceGroupName: 'REPLACE-WITH-RESOURCE-GROUP'
  azureLocation: 'eastus'
  containerRegistryName: 'REPLACEWITHUNIQUEACRNAME'
  pipelinePrincipalId: 'REPLACE-WITH-SERVICE-PRINCIPAL-OBJECT-ID'
  containerAppEnvironmentName: 'pd-mortgages-env'
  storageAccountName: 'REPLACEWITHUNIQUESTORAGE'
  mortgagesWebAppName: 'pd-mortgages-web'
  productsApiAppName: 'pd-products-api'
  buildConfiguration: 'Release'

stages:
  - stage: BuildAndTest
    displayName: Build and test
    jobs:
      - job: BuildAndTest
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: $(dotnetVersion)

          - script: dotnet restore PD.Mortgages.slnx
            displayName: Restore solution

          - script: dotnet build PD.Mortgages.slnx --configuration $(buildConfiguration) --no-restore
            displayName: Build solution

          - script: dotnet test PD.Mortgages.slnx --configuration $(buildConfiguration) --no-build --no-restore --verbosity normal
            displayName: Run tests

  - stage: BuildImagesAndDeploy
    displayName: Build images and deploy demo apps
    dependsOn: BuildAndTest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildImagesAndDeploy
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Build, push, and deploy to Azure Container Apps
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                pipelinePrincipalId="$PIPELINE_PRINCIPAL_ID"
                productApiKey="$(openssl rand -hex 32)"

                commonParameters=(
                  "location=$AZURE_LOCATION"
                  "containerRegistryName=$ACR_NAME"
                  "containerAppEnvironmentName=$CONTAINER_APP_ENVIRONMENT"
                  "storageAccountName=$STORAGE_ACCOUNT_NAME"
                  "mortgagesWebAppName=$MORTGAGES_WEB_APP"
                  "productsApiAppName=$PRODUCTS_API_APP"
                  "imageTag=$BUILD_BUILDID"
                  "pipelinePrincipalId=$pipelinePrincipalId"
                  "productServiceApiKey=$productApiKey"
                )

                az deployment group create \
                  --name pd-mortgages-foundation \
                  --resource-group "$RESOURCE_GROUP" \
                  --template-file infra/main.bicep \
                  --parameters "${commonParameters[@]}" deployApps=false

                loginServer="$(az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --query loginServer --output tsv)"
                for attempt in $(seq 1 10); do
                  if az acr login --name "$ACR_NAME"; then
                    break
                  fi
                  if [ "$attempt" -eq 10 ]; then
                    echo 'ACR login failed after retrying; check the service connection AcrPush role.' >&2
                    exit 1
                  fi
                  sleep 30
                done

                docker build --file PD.Mortgages.Web/Dockerfile --tag "$loginServer/mortgages-web:$BUILD_BUILDID" .
                docker build --file PD.Products.Api/Dockerfile --tag "$loginServer/products-api:$BUILD_BUILDID" .
                docker build --file PD.Mortgages.Staff.Web/Dockerfile --tag "$loginServer/mortgages-staff-web:$BUILD_BUILDID" .

                docker push "$loginServer/mortgages-web:$BUILD_BUILDID"
                docker push "$loginServer/products-api:$BUILD_BUILDID"
                docker push "$loginServer/mortgages-staff-web:$BUILD_BUILDID"

                az deployment group create \
                  --name pd-mortgages-apps \
                  --resource-group "$RESOURCE_GROUP" \
                  --template-file infra/main.bicep \
                  --parameters "${commonParameters[@]}" deployApps=true
            env:
              RESOURCE_GROUP: $(resourceGroupName)
              AZURE_LOCATION: $(azureLocation)
              ACR_NAME: $(containerRegistryName)
              PIPELINE_PRINCIPAL_ID: $(pipelinePrincipalId)
              CONTAINER_APP_ENVIRONMENT: $(containerAppEnvironmentName)
              STORAGE_ACCOUNT_NAME: $(storageAccountName)
              MORTGAGES_WEB_APP: $(mortgagesWebAppName)
              PRODUCTS_API_APP: $(productsApiAppName)
