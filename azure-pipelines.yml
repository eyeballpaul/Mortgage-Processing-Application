trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  dotnetVersion: '10.x'
  azureServiceConnection: 'REPLACE-WITH-AZURE-DEVOPS-SERVICE-CONNECTION'
  resourceGroupName: 'REPLACE-WITH-RESOURCE-GROUP'
  azureLocation: 'eastus'
  containerRegistryName: 'REPLACEWITHUNIQUEACRNAME'
  pipelinePrincipalId: 'REPLACE-WITH-SERVICE-PRINCIPAL-OBJECT-ID'
  pipelinePrincipalName: 'REPLACE-WITH-SERVICE-PRINCIPAL-DISPLAY-NAME'
  containerAppEnvironmentName: 'pd-mortgages-env'
  sqlServerName: 'REPLACEWITHUNIQUESQLSERVER'
  documentStorageAccountName: 'REPLACEWITHUNIQUEDOCUMENTS'
  mortgagesWebAppName: 'pd-mortgages-web'
  productsApiAppName: 'pd-products-api'
  eligibilityApiAppName: 'pd-eligibility-api'
  mortgageApiAppName: 'pd-mortgages-api'
  staffWebAppName: 'pd-mortgages-staff-web'
  mortgageApiClientId: 'REPLACE-WITH-MORTGAGE-API-CLIENT-ID'
  staffClientId: 'REPLACE-WITH-STAFF-WEB-CLIENT-ID'
  alertEmail: ''
  otlpEndpoint: ''
  otlpProtocol: 'grpc'
  buildConfiguration: 'Release'

stages:
  - stage: BuildAndTest
    displayName: Build and test
    jobs:
      - job: BuildAndTest
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: $(dotnetVersion)

          - script: dotnet restore PD.Mortgages.slnx
            displayName: Restore solution

          - script: dotnet build PD.Mortgages.slnx --configuration $(buildConfiguration) --no-restore
            displayName: Build solution

          - script: dotnet test PD.Mortgages.slnx --configuration $(buildConfiguration) --no-build --no-restore --verbosity normal
            displayName: Run tests

  - stage: BuildImagesAndDeploy
    displayName: Build images and deploy demo apps
    dependsOn: BuildAndTest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildImagesAndDeploy
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: $(dotnetVersion)

          - script: dotnet restore PD.Mortgages.slnx
            displayName: Restore solution for deployment bootstrap

          - task: AzureCLI@2
            displayName: Build, push, and deploy to Azure Container Apps
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                pipelinePrincipalId="$PIPELINE_PRINCIPAL_ID"
                if [[ -z "$STAFF_CLIENT_SECRET" || "$STAFF_CLIENT_SECRET" == '$('* ]]; then
                  echo 'Set the secret pipeline variable staffClientSecret to the staff Entra app secret value.' >&2
                  exit 1
                fi
                if [[ ! "$PRODUCT_SERVICE_API_KEY" =~ ^[A-Za-z0-9_-]{32,128}$ ]]; then
                  echo 'Set the secret pipeline variable productServiceApiKey to 32-128 URL-safe characters.' >&2
                  exit 1
                fi
                productApiKey="$PRODUCT_SERVICE_API_KEY"
                if [[ ! "$ELIGIBILITY_SERVICE_API_KEY" =~ ^[A-Za-z0-9_-]{32,128}$ ]]; then
                  echo 'Set the secret pipeline variable eligibilityServiceApiKey to 32-128 URL-safe characters.' >&2
                  exit 1
                fi
                servers="$(az sql server list --resource-group "$RESOURCE_GROUP" --output json)"
                if jq -e --arg name "$SQL_SERVER_NAME" 'any(.[]; .name == $name)' <<< "$servers" > /dev/null; then
                  createSqlServer=false
                else
                  createSqlServer=true
                fi

                commonParameters=(
                  "location=$AZURE_LOCATION"
                  "containerRegistryName=$ACR_NAME"
                  "containerAppEnvironmentName=$CONTAINER_APP_ENVIRONMENT"
                  "sqlServerName=$SQL_SERVER_NAME"
                  "documentStorageAccountName=$DOCUMENT_STORAGE_ACCOUNT_NAME"
                  "mortgagesWebAppName=$MORTGAGES_WEB_APP"
                  "productsApiAppName=$PRODUCTS_API_APP"
                  "eligibilityApiAppName=$ELIGIBILITY_API_APP"
                  "mortgageApiAppName=$MORTGAGE_API_APP"
                  "staffWebAppName=$STAFF_WEB_APP"
                  "mortgageApiClientId=$MORTGAGE_API_CLIENT_ID"
                  "staffClientId=$STAFF_CLIENT_ID"
                  "staffClientSecret=$STAFF_CLIENT_SECRET"
                  "imageTag=$BUILD_BUILDID"
                  "pipelinePrincipalId=$pipelinePrincipalId"
                  "pipelinePrincipalName=$PIPELINE_PRINCIPAL_NAME"
                  "productServiceApiKey=$productApiKey"
                  "eligibilityServiceApiKey=$ELIGIBILITY_SERVICE_API_KEY"
                  "alertEmail=$ALERT_EMAIL"
                  "otlpEndpoint=$OTLP_ENDPOINT"
                  "otlpProtocol=$OTLP_PROTOCOL"
                )

                az bicep build --file infra/main.bicep --stdout > /dev/null
                az deployment group validate \
                  --resource-group "$RESOURCE_GROUP" \
                  --template-file infra/main.bicep \
                  --parameters "${commonParameters[@]}" "createSqlServer=$createSqlServer" deployApps=false \
                  --output none

                az deployment group create \
                  --name pd-mortgages-foundation \
                  --resource-group "$RESOURCE_GROUP" \
                  --template-file infra/main.bicep \
                  --parameters "${commonParameters[@]}" "createSqlServer=$createSqlServer" deployApps=false

                deploymentOutputs="$(az deployment group show \
                  --name pd-mortgages-foundation \
                  --resource-group "$RESOURCE_GROUP" \
                  --query properties.outputs \
                  --output json)"
                databaseServerName="$(jq -r '.databaseServerName.value' <<< "$deploymentOutputs")"
                mortgagesIdentityName="$(jq -r '.mortgagesIdentityName.value' <<< "$deploymentOutputs")"
                mortgagesIdentityClientId="$(jq -r '.mortgagesIdentityClientId.value' <<< "$deploymentOutputs")"
                productsIdentityName="$(jq -r '.productsIdentityName.value' <<< "$deploymentOutputs")"
                productsIdentityClientId="$(jq -r '.productsIdentityClientId.value' <<< "$deploymentOutputs")"
                customerSessionsIdentityName="$(jq -r '.customerSessionsIdentityName.value' <<< "$deploymentOutputs")"
                customerSessionsIdentityClientId="$(jq -r '.customerSessionsIdentityClientId.value' <<< "$deploymentOutputs")"
                customerSessionsIdentityPrincipalId="$(jq -r '.customerSessionsIdentityPrincipalId.value' <<< "$deploymentOutputs")"

                for attempt in $(seq 1 12); do
                  if az ad sp show --id "$customerSessionsIdentityClientId" --output none; then
                    break
                  fi
                  if [ "$attempt" -eq 12 ]; then
                    echo 'The customer managed identity is not available in Entra; verify Graph permissions and retry.' >&2
                    exit 1
                  fi
                  sleep 10
                done
                apiServicePrincipal="$(az ad sp show --id "$MORTGAGE_API_CLIENT_ID" --output json)"
                apiPrincipalId="$(jq -r '.id' <<< "$apiServicePrincipal")"
                customerRoleId="$(jq -r '[.appRoles[] | select(.value == "MortgageCustomer" and .isEnabled and (.allowedMemberTypes | index("Application")))] | if length == 1 then .[0].id else empty end' <<< "$apiServicePrincipal")"
                if [[ -z "$customerRoleId" ]]; then
                  echo 'The Mortgage API service principal must expose exactly one enabled MortgageCustomer application role.' >&2
                  exit 1
                fi
                assignmentUrl="https://graph.microsoft.com/v1.0/servicePrincipals/$customerSessionsIdentityPrincipalId/appRoleAssignments"
                existingAssignment="$(az rest --method get --url "$assignmentUrl" --query "value[?resourceId=='$apiPrincipalId' && appRoleId=='$customerRoleId'].id | [0]" --output tsv)"
                if [[ -z "$existingAssignment" ]]; then
                  assignmentBody="$(jq -n --arg principal "$customerSessionsIdentityPrincipalId" --arg resource "$apiPrincipalId" --arg role "$customerRoleId" '{principalId:$principal,resourceId:$resource,appRoleId:$role}')"
                  az rest --method post --url "$assignmentUrl" --body "$assignmentBody" --output none
                fi

                dotnet run --project PD.Mortgages.DatabaseBootstrap/PD.Mortgages.DatabaseBootstrap.csproj \
                  --configuration Release --no-restore -- \
                  --server "$databaseServerName" \
                  --mortgages-identity-name "$mortgagesIdentityName" \
                  --mortgages-identity-client-id "$mortgagesIdentityClientId" \
                  --products-identity-name "$productsIdentityName" \
                  --products-identity-client-id "$productsIdentityClientId" \
                  --customer-sessions-identity-name "$customerSessionsIdentityName" \
                  --customer-sessions-identity-client-id "$customerSessionsIdentityClientId"

                loginServer="$(az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --query loginServer --output tsv)"
                for attempt in $(seq 1 10); do
                  if az acr login --name "$ACR_NAME"; then
                    break
                  fi
                  if [ "$attempt" -eq 10 ]; then
                    echo 'ACR login failed after retrying; check the service connection AcrPush role.' >&2
                    exit 1
                  fi
                  sleep 30
                done

                docker build --file PD.Mortgages.Customer.Web/Dockerfile --tag "$loginServer/mortgages-web:$BUILD_BUILDID" .
                docker build --file PD.Mortgages.Api/Dockerfile --tag "$loginServer/mortgages-api:$BUILD_BUILDID" .
                docker build --file PD.Products.Api/Dockerfile --tag "$loginServer/products-api:$BUILD_BUILDID" .
                docker build --file PD.Eligibility.Api/Dockerfile --tag "$loginServer/eligibility-api:$BUILD_BUILDID" .
                docker build --file PD.Mortgages.Staff.Web/Dockerfile --tag "$loginServer/mortgages-staff-web:$BUILD_BUILDID" .

                docker push "$loginServer/mortgages-web:$BUILD_BUILDID"
                docker push "$loginServer/mortgages-api:$BUILD_BUILDID"
                docker push "$loginServer/products-api:$BUILD_BUILDID"
                docker push "$loginServer/eligibility-api:$BUILD_BUILDID"
                docker push "$loginServer/mortgages-staff-web:$BUILD_BUILDID"

                az deployment group validate \
                  --resource-group "$RESOURCE_GROUP" \
                  --template-file infra/main.bicep \
                  --parameters "${commonParameters[@]}" createSqlServer=false deployApps=true \
                  --output none

                az deployment group create \
                  --name pd-mortgages-apps \
                  --resource-group "$RESOURCE_GROUP" \
                  --template-file infra/main.bicep \
                  --parameters "${commonParameters[@]}" createSqlServer=false deployApps=true

                for output in mortgagesWebUrl staffWebUrl; do
                  url="$(az deployment group show --name pd-mortgages-apps --resource-group "$RESOURCE_GROUP" \
                    --query "properties.outputs.$output.value" --output tsv)"
                  if [[ "$url" != https://* ]]; then
                    echo "Deployment did not return an HTTPS URL for $output." >&2
                    exit 1
                  fi
                  ready=false
                  for attempt in $(seq 1 24); do
                    if status="$(curl --fail --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$url/health/ready")" &&
                       [[ "$status" == 200 ]]; then
                      ready=true
                      break
                    fi
                    sleep 10
                  done

                  customerUrl="$(az deployment group show --name pd-mortgages-apps --resource-group "$RESOURCE_GROUP" \
                    --query 'properties.outputs.mortgagesWebUrl.value' --output tsv)"
                  dependenciesReady=false
                  for attempt in $(seq 1 12); do
                    if curl --fail --silent --show-error --max-time 30 "$customerUrl/health/dependencies" --output /dev/null; then
                      dependenciesReady=true
                      break
                    fi
                    sleep 10
                  done
                  if [[ "$dependenciesReady" != true ]]; then
                    echo 'An authenticated Products or Eligibility API dependency check failed.' >&2
                    exit 1
                  fi
                  if [[ "$ready" != true ]]; then
                    echo "$output did not become ready after deployment." >&2
                    exit 1
                  fi
                done
            env:
              RESOURCE_GROUP: $(resourceGroupName)
              AZURE_LOCATION: $(azureLocation)
              ACR_NAME: $(containerRegistryName)
              PIPELINE_PRINCIPAL_ID: $(pipelinePrincipalId)
              PIPELINE_PRINCIPAL_NAME: $(pipelinePrincipalName)
              CONTAINER_APP_ENVIRONMENT: $(containerAppEnvironmentName)
              SQL_SERVER_NAME: $(sqlServerName)
              DOCUMENT_STORAGE_ACCOUNT_NAME: $(documentStorageAccountName)
              MORTGAGES_WEB_APP: $(mortgagesWebAppName)
              PRODUCTS_API_APP: $(productsApiAppName)
              ELIGIBILITY_API_APP: $(eligibilityApiAppName)
              MORTGAGE_API_APP: $(mortgageApiAppName)
              STAFF_WEB_APP: $(staffWebAppName)
              MORTGAGE_API_CLIENT_ID: $(mortgageApiClientId)
              STAFF_CLIENT_ID: $(staffClientId)
              STAFF_CLIENT_SECRET: $(staffClientSecret)
              PRODUCT_SERVICE_API_KEY: $(productServiceApiKey)
              ELIGIBILITY_SERVICE_API_KEY: $(eligibilityServiceApiKey)
              ALERT_EMAIL: $(alertEmail)
              OTLP_ENDPOINT: $(otlpEndpoint)
              OTLP_PROTOCOL: $(otlpProtocol)
